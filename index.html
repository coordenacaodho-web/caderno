<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno de Benefícios Inteligente</title>
<meta name="theme-color" content="#00a297">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caderno Inteligente">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Layout: app de balcão no padrão Farmácias Unipreço. Topo verde com as duas buscas, lista de produtos, ficha do produto com ações fixas no rodapé. */
  :root{
    --navy:#00a297; --navy-2:#00756d; --brand-red:#e62e34;
    --bg:#f2f8f7; --surface:#ffffff; --surface-2:#e8f3f1;
    --ink:#16302d; --muted:#557370; --line:#d6e6e3;
    --teal:#0f8f8a; --teal-soft:#e1f3f1; --teal-ink:#0a6d69;
    --orange:#e62e34; --orange-soft:#fdeaea; --orange-ink:#b8232a;
    --yellow:#ffc928; --yellow-ink:#2b1d00;
    --red:#d62f3a; --red-soft:#fdeced;
    --on-navy:#ffffff;
    --font-display:'Nunito', system-ui, sans-serif;
    --font-body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1a19; --surface:#122725; --surface-2:#18322f; --ink:#e6f2f0; --muted:#94b3ae; --line:#23403c;
      --teal-soft:#123a3a; --teal-ink:#7fd8d2; --orange-soft:#3a1517; --orange-ink:#ff8a8f;
      --red:#ff6b74; --red-soft:#3a1519; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1a19; --surface:#122725; --surface-2:#18322f; --ink:#e6f2f0; --muted:#94b3ae; --line:#23403c;
    --teal-soft:#123a3a; --teal-ink:#7fd8d2; --orange-soft:#3a1517; --orange-ink:#ff8a8f;
    --red:#ff6b74; --red-soft:#3a1519; color-scheme:dark;
  }
  *{ box-sizing:border-box }
  html,body{ margin:0; min-height:100% }
  body{ background:var(--bg); color:var(--ink); font:16px/1.45 var(--font-body); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent }
  img{ max-width:100% }
  button,input{ font:inherit; color:inherit }
  h1,h2,h3{ font-family:var(--font-display); margin:0; text-wrap:balance }
  :focus-visible{ outline:3px solid var(--orange); outline-offset:2px }
  .wrap{ max-width:560px; margin:0 auto; padding-inline:16px }

  /* ===== topo ===== */
  .top{ background:var(--navy); color:var(--on-navy); padding:calc(14px + env(safe-area-inset-top,0px)) 0 22px; border-radius:0 0 26px 26px }
  .brand{ display:flex; align-items:center; justify-content:space-between; gap:12px }
  .brand img{ height:34px; width:auto }
  
  .top h1{ font-size:24px; font-weight:700; margin:18px 0 14px; line-height:1.2 }
  .fields{ display:flex; flex-direction:column; gap:10px }
  .field{ position:relative }
  .field label{ display:block; font:600 11px var(--font-display); letter-spacing:.12em; text-transform:uppercase; opacity:.8; margin:0 0 6px 4px }
  .field input{ width:100%; height:52px; border-radius:14px; border:2px solid transparent; background:#fff; color:#1b2333; padding:0 44px 0 46px; font-size:16px; outline:none }
  .field input:focus{ border-color:var(--orange) }
  .field input::placeholder{ color:#7c869a }
  .field svg.lead{ position:absolute; left:14px; bottom:15px; width:22px; height:22px; color:var(--navy-2); pointer-events:none }
  .field .clear{ position:absolute; right:6px; bottom:6px; width:40px; height:40px; border:0; background:none; color:#7c869a; border-radius:10px; cursor:pointer; display:grid; place-items:center }
  .field .clear svg{ width:18px; height:18px }
  .field .clear[hidden]{ display:none }
  .empty .alt{ margin-top:12px; border:0; background:var(--teal); color:#fff; font-weight:600; font-size:15px; padding:10px 16px; border-radius:12px; cursor:pointer }


  .top{ position:relative; overflow:hidden }
  .top .wrap{ position:relative }
  .top h1{ max-width:62%; font-weight:900 }
  .top h1 em{ display:block; font-style:normal; color:#fff; background:var(--brand-red); width:max-content; padding:0 10px; border-radius:8px; margin-top:4px; font-size:20px }
  .mascote{ position:absolute; right:4px; top:46px; width:112px; height:auto; pointer-events:none }
  .fields{ position:relative; z-index:1 }
  .brand img{ height:40px }
  .field input{ color:#16302d }
  .field svg.lead{ color:var(--navy-2) }

  /* ===== home ===== */
  main{ padding-block:18px 32px }
  .sec-lbl{ font:600 12px var(--font-display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:4px 0 10px }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px }
  .chip{ border:0; background:var(--teal-soft); color:var(--teal-ink); font-weight:600; font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer }
  .chip[aria-pressed="true"]{ background:var(--teal); color:#fff }
  .list{ display:flex; flex-direction:column; gap:12px }
  .card{ display:grid; grid-template-columns:84px 1fr auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:12px; text-decoration:none; color:inherit; cursor:pointer; text-align:left; width:100% }
  .card:active{ transform:scale(.99) }
  .card .ph{ width:84px; height:84px; border-radius:14px; background:#fff; overflow:hidden; display:grid; place-items:center }
  .card .ph img{ width:100%; height:100%; object-fit:contain }
  .card .tx{ min-width:0 }
  .card h3{ font-size:19px; font-weight:700 }
  .card .ind{ color:var(--muted); font-size:13.5px; margin:1px 0 7px }
  .card .row{ display:flex; flex-wrap:wrap; gap:6px }
  .age-s{ background:var(--yellow); color:var(--yellow-ink); font:800 12px var(--font-display); padding:3px 9px; border-radius:999px }
  .match{ background:var(--teal-soft); color:var(--teal-ink); font-weight:600; font-size:12px; padding:3px 9px; border-radius:999px }
  .card .go{ width:22px; height:22px; color:var(--muted) }
  .empty{ text-align:center; padding:28px 16px; color:var(--muted); background:var(--surface); border:1px dashed var(--line); border-radius:18px }
  .empty b{ display:block; color:var(--ink); font-family:var(--font-display); font-size:17px; margin-bottom:4px }
  .count{ font-size:13px; color:var(--muted); margin:0 0 10px }

  .cats{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin:0 -16px 18px; padding-inline:16px; scrollbar-width:none }
  .cats::-webkit-scrollbar{ display:none }
  .cat{ flex:none; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:14px; padding:7px 13px; border-radius:999px; cursor:pointer }
  .cat[aria-pressed="true"]{ background:var(--navy-2); border-color:var(--navy-2); color:#fff }
  .ini{ width:100%; height:100%; display:grid; place-items:center; background:var(--teal-soft); color:var(--teal-ink); font:900 26px var(--font-display) }
  .hero .ph .ini{ font-size:38px }
  .pub-s{ background:var(--surface-2); color:var(--muted); font-weight:700; font-size:12px; padding:3px 9px; border-radius:999px }
  .contra.vazia{ border-style:dashed }
  .contra.vazia p{ margin:0; font-weight:600; color:var(--red); font-size:15px }
  .uso{ background:var(--surface-2); border-radius:16px; padding:14px 16px }
  .uso small{ display:block; font:800 11px var(--font-display); letter-spacing:.12em; text-transform:uppercase; color:var(--teal-ink); margin-bottom:2px }

  /* ===== ficha ===== */
  .det-top{ background:var(--navy); color:var(--on-navy); padding:calc(10px + env(safe-area-inset-top,0px)) 0 0; position:relative }
  .det-top::after{ content:""; display:block; height:26px; background:var(--bg); border-radius:26px 26px 0 0; margin-top:-2px }
  .back{ display:inline-flex; align-items:center; gap:6px; border:0; background:rgba(255,255,255,.12); color:#fff; font-weight:600; font-size:15px; padding:9px 14px 9px 10px; border-radius:999px; cursor:pointer }
  .back svg{ width:18px; height:18px }
  .hero{ display:grid; grid-template-columns:1fr 112px; gap:12px; align-items:end; margin-top:16px }
  .hero .age{ grid-column:1 / -1; justify-self:start }
  .hero .tag{ display:inline-block; background:var(--orange); color:#fff; font:600 11px var(--font-display); letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:999px }
  .hero h2{ font-size:34px; font-weight:800; line-height:1.05; margin:8px 0 4px }
  .hero .ind{ opacity:.85; font-size:14px }
  .hero .ph{ width:112px; height:112px; align-self:start; border-radius:50%; background:#fff; overflow:hidden; border:4px solid #fff; position:relative; z-index:1; box-shadow:0 10px 24px rgba(0,0,0,.25) }
  .hero .ph img{ width:100%; height:100%; object-fit:contain }
  .age{ display:inline-flex; align-items:center; gap:10px; background:var(--yellow); color:var(--yellow-ink); border-radius:14px; padding:7px 18px 7px 7px; margin-top:4px }
  .age .n{ width:40px; height:40px; border-radius:50%; background:var(--yellow-ink); color:var(--yellow); font:800 16px/40px var(--font-display); text-align:center }
  .age small{ display:block; font:700 10px var(--font-display); letter-spacing:.12em; text-transform:uppercase; opacity:.75 }
  .age b{ font:800 17px/1.15 var(--font-display) }
  .det{ display:flex; flex-direction:column; gap:14px; padding-bottom:calc(170px + env(safe-area-inset-bottom,0px)) }
  .contra{ border:1.5px solid var(--red); background:var(--red-soft); border-radius:16px; padding:14px 16px }
  .contra .hd{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px }
  .contra .hd svg{ width:22px; height:22px; color:var(--red) }
  .contra h3{ font-size:16px; font-weight:800; color:var(--red); text-transform:uppercase; letter-spacing:.04em }
  .contra .flag{ font:700 10px var(--font-display); letter-spacing:.08em; text-transform:uppercase; color:var(--red); border:1px dashed var(--red); border-radius:999px; padding:2px 8px }
  .contra ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px }
  .contra li{ padding-left:22px; position:relative; font-weight:500 }
  .contra li::before{ content:"✕"; position:absolute; left:2px; color:var(--red); font-weight:800 }
  .pos{ border-left:5px solid var(--navy); background:var(--surface-2); border-radius:0 14px 14px 0; padding:12px 16px }
  .pos small{ display:block; font:800 11px var(--font-display); letter-spacing:.12em; text-transform:uppercase; color:var(--teal-ink); margin-bottom:2px }
  .box{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px }
  .box h3{ font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--navy-2); margin-bottom:8px }
  :root[data-theme="dark"] .box h3{ color:#6fd6cc }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .box h3{ color:#6fd6cc } }
  .box ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px }
  .box li{ padding-left:18px; position:relative }
  .box li::before{ content:""; position:absolute; left:2px; top:9px; width:8px; height:8px; border-radius:50%; background:var(--teal) }
  .box.plus li::before{ content:"+"; width:auto; height:auto; background:none; top:0; color:var(--orange); font-weight:800 }
  .box .chips{ margin:0 }
  .box .chip{ cursor:default }
  .comp{ display:flex; flex-wrap:wrap; gap:8px }
  .comp span{ background:var(--surface-2); border-radius:10px; padding:7px 12px; font-weight:600 }
  .quote{ background:var(--surface-2); border-radius:16px; padding:14px 16px; font-weight:500 }
  .quote small{ display:block; font:700 11px var(--font-display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:4px }

  .actions{ position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px)); box-shadow:0 -8px 24px rgba(10,25,60,.08); z-index:5 }
  .actions .wrap{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; height:52px; border-radius:14px; border:0; font:600 15px var(--font-display); text-decoration:none; cursor:pointer }
  .btn svg{ width:20px; height:20px }
  .btn.pri{ grid-column:1 / -1; background:var(--navy-2); color:#fff }
  .btn.sec{ background:var(--surface-2); color:var(--ink) }
  .btn.wa{ background:#1fa855; color:#fff }
  .toast{ position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; z-index:9; max-width:calc(100% - 32px) }
  @media (prefers-reduced-motion: no-preference){
    .view{ animation:in .22s ease-out }
    @keyframes in{ from{ opacity:.4; transform:translateY(6px) } to{ opacity:1; transform:none } }
  }
</style>
</head>
<body>

<div id="home" class="view">
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <img src="img/unipreco-branco.png" alt="Farmácias Unipreço">
      </div>
      <h1>Caderno de Benefícios <em>Inteligente</em></h1>
      <img class="mascote" src="img/mascote.webp" alt="" width="355" height="640">
      <div class="fields">
        <div class="field">
          <label for="qProduto">Buscar produto</label>
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4M10.5 3v3.5a5 5 0 0 0-3 4.6V19a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2v-7.9a5 5 0 0 0-3-4.6V3"/></svg>
          <input id="qProduto" type="search" placeholder="Nome do produto ou indústria" autocomplete="off" enterkeyhint="search">
          <button class="clear" data-clear="qProduto" aria-label="Limpar busca de produto" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="field">
          <label for="qSintoma">Buscar por sintoma</label>
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
          <input id="qSintoma" type="search" placeholder="Ex.: tosse, gripe, garganta" autocomplete="off" enterkeyhint="search">
          <button class="clear" data-clear="qSintoma" aria-label="Limpar busca por sintoma" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <p class="sec-lbl">Sintomas mais comuns</p>
    <div class="chips" id="chips"></div>
    <p class="sec-lbl">Categorias</p>
    <div class="cats" id="cats" role="group" aria-label="Filtrar por categoria"></div>
    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
  </main>
</div>

<div id="detail" class="view" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="produtos.js"></script>
<script>
(function(){
  const P = window.PRODUTOS || [];
  const $ = s => document.querySelector(s);
  const norm = s => (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
  const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const icon = {
    go:'<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
    warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
    down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
    person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:20px;height:20px;vertical-align:middle"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
    share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>'
  };

  // índice de busca
  P.forEach(p => {
    p._prod = norm([p.nome, p.industria, p.tipo, p.categoria].join(' '));
    p._sint = (p.sintomas||[]).concat(p.palavrasChave||[]).map(norm);
  });

  // ===== home =====
  const qP = $('#qProduto'), qS = $('#qSintoma');
  P.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const freq = {};
  P.forEach(p => (p.sintomas||[]).forEach(s => { const k = norm(s); freq[k] = freq[k] || {s, n:0}; freq[k].n++; }));
  const allSint = Object.values(freq).sort((a,b) => b.n - a.n || a.s.localeCompare(b.s)).slice(0, 12).map(x => x.s);
  const cats = [...new Set(P.map(p => p.categoria).filter(Boolean))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  let catSel = '';
  $('#cats').innerHTML = ['Todas'].concat(cats).map(c => `<button class="cat" type="button" data-c="${c === 'Todas' ? '' : esc(c)}" aria-pressed="${c === 'Todas'}">${esc(c)}</button>`).join('');
  $('#cats').addEventListener('click', ev => {
    const b = ev.target.closest('.cat'); if (!b) return;
    catSel = b.dataset.c;
    document.querySelectorAll('#cats .cat').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
  function iniciais(n){ const w = n.split(/[\s-]+/).filter(x => /^[\p{L}\d]/u.test(x)); return ((w[0]||'?')[0] + ((w[1]||'')[0]||'')).toUpperCase(); }
  const foto = p => p.foto ? `<img src="${esc(p.foto)}" alt="" loading="lazy">` : `<span class="ini">${esc(iniciais(p.nome))}</span>`;
  $('#chips').innerHTML = allSint.map(s => `<button class="chip" type="button" data-s="${esc(s)}" aria-pressed="false">${esc(s)}</button>`).join('');

  // Busca por sintoma com pontuação: sintoma da ficha > palavra-chave exata > começo de palavra (radical).
  const PARADAS = new Set(['com','sem','dor','dores','para','pela','pelo','que','nao','muito','meu','minha','tem','esta','estou','de','da','do','na','no','e','o','a']);
  const raiz = w => w.length <= 4 ? w : w.slice(0, Math.max(4, w.length - 3));
  const casa = (w, kw) => kw.length >= 3 && (kw === w || (w.length >= 4 && kw.length >= 4 && (kw.startsWith(raiz(w)) || w.startsWith(raiz(kw)))));
  function matchSintoma(p, q){
    const words = q.split(/\s+/).filter(w => w.length > 2 && !PARADAS.has(w));
    if (!words.length) return null;
    let melhor = null, pts = 0;
    for (const s of (p.sintomas||[])) {
      const n = norm(s);
      let sc = n === q ? 100 : (n.includes(q) ? 60 : 0);
      const sw = n.split(/\s+/);
      const hits = words.filter(w => sw.some(x => casa(w, x))).length;
      if (hits === words.length) sc = Math.max(sc, 40 + hits * 5);
      if (sc > pts){ pts = sc; melhor = s; }
    }
    // palavras-chave: todas as palavras buscadas precisam aparecer
    const chaves = p._sint;
    const hitsK = words.filter(w => chaves.some(k => k === w || k.split(/\s+/).some(x => casa(w, x)))).length;
    if (hitsK === words.length) {
      const exata = chaves.some(k => k === q);
      const sc = exata ? 35 : 20 + hitsK * 3;
      if (sc > pts){ pts = sc; melhor = melhor || null; }
    }
    if (!pts) return null;
    if (!melhor) {
      melhor = (p.sintomas||[]).find(s => words.some(w => norm(s).split(/\s+/).some(x => casa(w, x)))) || (q.charAt(0).toUpperCase() + q.slice(1));
    }
    return { m: melhor, sc: pts };
  }

  function render(){
    const vp = norm(qP.value), vs = norm(qS.value);
    document.querySelectorAll('[data-clear]').forEach(b => b.hidden = !$('#'+b.dataset.clear).value);
    document.querySelectorAll('#chips .chip').forEach(c => c.setAttribute('aria-pressed', String(norm(c.dataset.s) === vs)));
    let rows = P.map(p => ({p, m:null}));
    if (catSel) rows = rows.filter(r => r.p.categoria === catSel);
    if (vp) { const ws = vp.split(/\s+/).filter(Boolean); rows = rows.filter(r => ws.every(w => r.p._prod.includes(w))); }
    if (vs) rows = rows.map(r => { const x = matchSintoma(r.p, vs); return {p:r.p, m:x && x.m, sc:x ? x.sc : 0}; }).filter(r => r.m).sort((a,b) => b.sc - a.sc || a.p.nome.localeCompare(b.p.nome,'pt-BR'));
    const busca = vp || vs || catSel;
    $('#count').textContent = busca ? `${rows.length} ${rows.length === 1 ? 'produto encontrado' : 'produtos encontrados'}` : `${P.length} ${P.length === 1 ? 'produto no catálogo' : 'produtos no catálogo'}`;
    if (!rows.length){
      const comoSintoma = vp && P.some(p => matchSintoma(p, vp));
      $('#list').innerHTML = `<div class="empty"><b>Nenhum produto para “${esc(qP.value || qS.value)}”</b>Tente outra palavra, como “tosse” ou “gripe”, ou toque num sintoma acima.${comoSintoma ? `<br><button class="alt" type="button" id="trocar">Buscar “${esc(qP.value)}” como sintoma</button>` : ''}</div>`;
      if (comoSintoma) $('#trocar').addEventListener('click', () => { qS.value = qP.value; qP.value = ''; render(); });
      return;
    }
    $('#list').innerHTML = rows.map(({p,m}) => `
      <a class="card" href="#${esc(p.id)}">
        <span class="ph">${foto(p)}</span>
        <span class="tx">
          <h3>${esc(p.nome)}</h3>
          <div class="ind">${esc([p.industria, p.apresentacao].filter(Boolean).join(' · '))}</div>
          <span class="row">${p.idadeMinima ? `<span class="age-s">${p.idadeMinima}+ anos</span>` : `<span class="pub-s">${esc(p.publico || 'Todos os públicos')}</span>`}${m ? `<span class="match">${esc(m)}</span>` : ''}</span>
        </span>
        ${icon.go}
      </a>`).join('');
  }
  qP.addEventListener('input', () => { if (qP.value) qS.value = ''; render(); });
  qS.addEventListener('input', () => { if (qS.value) qP.value = ''; render(); });
  document.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => { const i = $('#'+b.dataset.clear); i.value=''; render(); i.focus(); }));
  $('#chips').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    qS.value = c.getAttribute('aria-pressed') === 'true' ? '' : c.dataset.s; qP.value = '';
    render();
  });

  // ===== ficha =====
  function li(arr){ return (arr||[]).map(x => `<li>${esc(x)}</li>`).join(''); }
  function detail(p){
    const ci = p.contraindicacoes || [];
    const contra = ci.length
      ? `<section class="contra"><div class="hd">${icon.warn}<h3>Contraindicações</h3><span class="flag">A confirmar</span></div><ul>${li(ci)}</ul></section>`
      : `<section class="contra vazia"><div class="hd">${icon.warn}<h3>Contraindicações</h3><span class="flag">Não informadas</span></div><p>A ficha não traz contraindicações. Confira o rótulo antes de indicar, principalmente para gestantes, crianças e quem usa medicamentos.</p></section>`;
    const idade = p.idadeMinima
      ? `<div class="age"><span class="n">${p.idadeMinima}+</span><span><small>Faixa etária</small><b>${esc(p.publico || ('A partir de ' + p.idadeMinima + ' anos'))}</b></span></div>`
      : `<div class="age"><span class="n">${icon.person}</span><span><small>Público</small><b>${esc(p.publico || 'Todos os públicos')}</b></span></div>`;
    const sec = (cond, h) => cond ? h : '';
    const bc = (p.beneficiosCliente||[]).length ? p.beneficiosCliente : (p.beneficios||[]);
    $('#detail').innerHTML = `
      <header class="det-top"><div class="wrap">
        <button class="back" type="button" id="voltar">${icon.back}Voltar</button>
        <div class="hero">
          <div>
            <span class="tag">${esc(p.tipo || p.categoria)}</span>
            <h2>${esc(p.nome)}</h2>
            <div class="ind">${esc([p.industria, p.apresentacao].filter(Boolean).join(' · '))}</div>
          </div>
          <div class="ph">${p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.nome)}">` : `<span class="ini">${esc(iniciais(p.nome))}</span>`}</div>
          ${idade}
        </div>
      </div></header>
      <main class="wrap det">
        ${contra}
        ${sec(p.posicionamento, `<section class="pos"><small>Posicionamento</small>${esc(p.posicionamento)}</section>`)}
        ${sec((p.sintomas||[]).length, `<section class="box"><h3>Indicar quando o cliente relatar</h3><div class="chips">${(p.sintomas||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></section>`)}
        ${sec(bc.length, `<section class="box"><h3>Benefícios para o cliente</h3><ul>${li(bc)}</ul></section>`)}
        ${sec(p.modoDeUso, `<section class="uso"><small>Modo de uso</small>${esc(p.modoDeUso)}</section>`)}
        ${sec((p.vendaAdicional||[]).length, `<section class="box plus"><h3>Venda adicional</h3><ul>${li(p.vendaAdicional)}</ul></section>`)}
        ${sec((p.concorrentes||[]).length, `<section class="box"><h3>Concorrentes</h3><div class="comp">${(p.concorrentes||[]).map(c=>`<span>${esc(c)}</span>`).join('')}</div></section>`)}
        ${sec(p.abordagem, `<section class="quote"><small>Abordagem no balcão</small>“${esc(p.abordagem)}”</section>`)}
      </main>
      <div class="actions"><div class="wrap">
        <a class="btn pri" href="${esc(p.pdf)}" target="_blank" rel="noopener">${icon.doc}Abrir caderno completo</a>
        <a class="btn sec" href="${esc(p.pdf)}" download="Caderno de Beneficios - ${esc(p.nome)}.pdf">${icon.down}Baixar PDF</a>
        <button class="btn wa" type="button" id="enviar">${icon.share}Enviar</button>
      </div></div>`;
    $('#voltar').addEventListener('click', () => { if (history.length > 1) history.back(); else location.hash = ''; });
    $('#enviar').addEventListener('click', () => enviar(p));
  }

  async function enviar(p){
    const url = new URL(p.pdf, location.href).href;
    const texto = `Caderno de Benefícios ${p.nome}${p.industria ? ' (' + p.industria + ')' : ''}: ${p.posicionamento || p.resumo || ''}`;
    try {
      const blob = await (await fetch(p.pdf)).blob();
      const file = new File([blob], `Caderno de Beneficios - ${p.nome}.pdf`, { type:'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files:[file] })) {
        await navigator.share({ files:[file], title:`Caderno ${p.nome}`, text:texto });
        return;
      }
      if (navigator.share) { await navigator.share({ title:`Caderno ${p.nome}`, text:texto, url }); return; }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    // computador ou navegador sem compartilhamento: abre o WhatsApp com o link do PDF
    window.open('https://wa.me/?text=' + encodeURIComponent(texto + '\n' + url), '_blank', 'noopener');
    toast('Abrindo o WhatsApp com o link do caderno');
  }

  let tt;
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

  // ===== rotas =====
  function route(){
    const id = decodeURIComponent(location.hash.slice(1));
    const p = P.find(x => x.id === id);
    $('#home').hidden = !!p; $('#detail').hidden = !p;
    if (p){ detail(p); window.scrollTo(0,0); document.title = `${p.nome} · Caderno Inteligente`; }
    else { document.title = 'Caderno de Benefícios Inteligente'; render(); }
  }
  window.addEventListener('hashchange', route);
  route();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
